# Served behind the cluster's Envoy Gateway, which terminates TLS and redirects http -> https.
server {
    listen 8080;
    server_name _;

    # Behind Envoy, nginx only sees plain HTTP on :8080. Absolute redirects (e.g. /about -> /about/) would
    # send browsers to http://<host>:8080/..., so send relative ones and let the browser keep https + host.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml application/atom+xml image/svg+xml;

    # Sculpin output (baked into the image)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Content kept outside git, on the Longhorn volume mounted at /srv/content.
    # photos/ includes an old PHP gallery (photos/www); only the static files are served for now.
    location /photos/ {
        root /srv/content;
    }

    location /pe7700/ {
        root /srv/content;
    }

    location ~* \.(?:jpe?g|png|gif|ico|css|js|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ \.php$ {
        return 404;
    }

    error_page 404 /404.html;
}
